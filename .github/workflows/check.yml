name: Vérifier Love Radar
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:ludo
      - run: npm run test:watch
      - run: npm run test:privacy
      - run: npm run test:puzzle
      - run: npm run test:call
      - run: npm run test:reconcile
      - run: npm run test:design
      - run: npm run test:chat
      - run: npm run test:activity
      - run: npm run test:animation
      - run: npm run test:replies
      - run: npm run test:voice-ui
      - run: npm run test:voice-outbox
      - run: npm run test:photos
      - run: npm run test:reliability
      - run: npm run test:security
      - run: npm run test:load
      - run: npm run build
