name: Vérifier Love Radar
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:ludo
      - run: npm run test:watch
      - run: npm run test:privacy
      - run: npm run test:puzzle
      - run: npm run build
