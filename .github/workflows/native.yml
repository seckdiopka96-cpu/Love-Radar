name: Construire Love Radar native

on:
  push:
    branches: [main]
    paths:
      - 'native/call-session/**'
      - 'scripts/configure-native.mjs'
      - 'scripts/prepare-testflight.mjs'
      - '.github/workflows/iphone-testflight.yml'
      - 'src/native-call-session.ts'
      - 'src/native-voip.ts'
      - 'src/native-screenshot.ts'
      - 'src/native-privacy.ts'
      - 'functions/api/screenshot.ts'
      - 'functions/lib/apns-voip.ts'
      - 'functions/api/voip.ts'
      - 'functions/api/call.ts'
      - 'tests/native-voip.test.ts'
      - 'src/VoiceCall.tsx'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'scripts/configure-native.mjs'
      - 'native/call-session/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer Capacitor et compiler l'interface
        run: |
          npm install
          npm run build
      - name: Générer Android et ses permissions
        run: |
          npx cap add android
          node scripts/configure-native.mjs android
          npx cap sync android
      - name: Compiler APK debug Android
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Joindre l'APK
        uses: actions/upload-artifact@v4
        with:
          name: love-radar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'feature/capacitor-native-ios-android'
    runs-on: macos-26-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer et compiler l'interface
        run: |
          npm install
          npm run build
      - name: Générer le projet iOS SPM
        run: |
          npx cap add ios --packagemanager SPM
          node scripts/configure-native.mjs ios
          npx cap sync ios
      - name: Vérifier les icônes iPhone et les options d'export TestFlight
        env:
          APPSTORE_TEAM_ID: 'TESTTEAM00'
        run: |
          set -euo pipefail
          node scripts/prepare-testflight.mjs
          plutil -lint ios/App/ExportOptions-TestFlight.plist
          sips -g pixelWidth -g pixelHeight ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test "$(sips -g pixelWidth ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '/pixelWidth/{print $2}')" = '1024'
          test "$(sips -g pixelHeight ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '/pixelHeight/{print $2}')" = '1024'
      - name: Compiler le simulateur iOS sans signature
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/love-radar-derived CODE_SIGNING_ALLOWED=NO build
      - name: Archiver le simulateur
        run: |
          cd /tmp/love-radar-derived/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/love-radar-ios-simulator.zip"
      - name: Joindre l'application iOS
        uses: actions/upload-artifact@v4
        with:
          name: love-radar-ios-simulator
          path: love-radar-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7

      # Device compilation is ARM64 for real iPhones, unlike the simulator.
      # This build is intentionally unsigned: it CANNOT be installed or
      # submitted to TestFlight without Apple Developer signing and a profile.
      - name: Compiler iPhone physique (ARM64, non signé)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/love-radar-device \
            CODE_SIGNING_ALLOWED=NO build

      - name: Préparer l'IPA iPhone NON SIGNÉ, réservé à la signature ultérieure
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="/tmp/love-radar-device/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$BUNDLE_ID" = "com.diaotech.loveradar"
          xcrun lipo -verify_arch arm64 "$APP_PATH/App"
          mkdir -p "$RUNNER_TEMP/lr-device-payload/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/lr-device-payload/Payload/App.app"
          cd "$RUNNER_TEMP/lr-device-payload"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Love-Radar-iPhone-UNSIGNED.ipa"
          test -s "$GITHUB_WORKSPACE/Love-Radar-iPhone-UNSIGNED.ipa"

      - name: Joindre l'IPA non signé (NE PAS INSTALLER : signature Apple requise)
        uses: actions/upload-artifact@v4
        with:
          name: love-radar-iphone-unsigned-ipa-NOT-INSTALLABLE
          path: Love-Radar-iPhone-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
